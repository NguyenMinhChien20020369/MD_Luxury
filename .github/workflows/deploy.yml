name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Chạy unit test và integration test
        run: ./mvnw clean test

      # --- BỔ SUNG BƯỚC VẼ BẢNG THỐNG KÊ KẾT QUẢ TEST ---
      - name: Báo cáo kết quả Test (Test Summary)
        uses: test-summary/action@v2
        with:
          paths: "**/target/surefire-reports/TEST-*.xml"
        if: always() # Luôn chạy để vẽ bảng kể cả khi có Test bị Fail